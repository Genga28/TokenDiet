[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokendiet"
version = "0.1.0"
description = "Local code graph for coding agents (Claude Code, Codex, Cursor) over MCP, with notes that carry across sessions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "tree-sitter>=0.25",
  "tree-sitter-language-pack>=1.0",
  "tiktoken>=0.7",
]

[project.scripts]
tokendiet = "tokendiet.cli:main"

[tool.setuptools]
packages = ["tokendiet"]
